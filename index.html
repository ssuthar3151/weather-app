<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
    <title>Weather App</title>
</head>
<body>
    <div class="container">
        <header>
            <h1>Weather App</h1>
        </header>
        <main>
            <div class="weather-card">
                <img src="weather-icon.png" alt="Weather Icon" class="weather-icon">
                <h2 class="location">City, Country</h2>
                <div class="weather-details">
                    <p class="temperature">25 °C</p>
                    <p class="condition">Sunny</p>
                </div>
            </div>
        </main>
        <footer>
            <p>Weather data provided by OpenWeather API</p>
        </footer>
    </div>
</body>
</html>
